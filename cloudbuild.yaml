substitutions:
  _SERVICE: ""
  _BRANCH: ""
  _FIREBASE_PROJECT_ID: ""
  _CORS_ORIGIN: ""
  # Google Cloud Storage bucket for ticket attachments (API runtime)
  _GCS_BUCKET: ""
  # URL publique de l'API (utilisée au build Next.js)
  _NEXT_PUBLIC_API_URL: ""
  # Firebase Web (utilisées au build Next.js pour le code client)
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""
  # Optionnelles (Storage/FCM/Analytics)
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
  _NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY 

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - 'apps/${_SERVICE}/Dockerfile'
      - '--tag=gcr.io/$PROJECT_ID/${_SERVICE}-${_BRANCH}:$SHORT_SHA'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/${_SERVICE}-${_BRANCH}:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}-${_BRANCH}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE}-${_BRANCH}:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - >-
        --set-env-vars=FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},
        CORS_ORIGIN=${_CORS_ORIGIN},
        GCS_BUCKET=${_GCS_BUCKET},
        NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},
        NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY},
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN},
        NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},
        NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID},
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET},
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID},
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID},
        NODE_ENV=production

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE}-${_BRANCH}:$SHORT_SHA'